apiVersion: apps/v1
kind: Deployment
metadata:
  name: eservices-deployment
  namespace: pi-apps
  labels:
    app: eservices
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eservices
  template:
    metadata:
      labels:
        app: eservices
    spec:
      containers:
      - name: eservices
        image: registry.gitlab.com/your-username/eservices:latest
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_APP_URL
          value: "https://eservices5527.pinet.com"
        - name: PI_API_KEY
          valueFrom:
            secretKeyRef:
              name: pi-secrets
              key: api-key
        - name: PI_SANDBOX_MODE
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: eservices-service
  namespace: pi-apps
spec:
  selector:
    app: eservices
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eservices-ingress
  namespace: pi-apps
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - eservices5527.pinet.com
    secretName: eservices-tls
  rules:
  - host: eservices5527.pinet.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eservices-service
            port:
              number: 80
