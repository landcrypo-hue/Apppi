version: '3.8'

services:
  eservices-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eservices-pi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://eservices5527.pinet.com
      - PI_API_KEY=${PI_API_KEY}
      - PI_SANDBOX_MODE=true
    networks:
      - eservices-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: eservices-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - eservices-app
    networks:
      - eservices-network

networks:
  eservices-network:
    driver: bridge
